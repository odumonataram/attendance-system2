{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>👨‍🎓 Student Attendance</h2>
        <p class="course-info">{{ qr_session.course.course_code }} - {{ qr_session.course.course_name }}</p>
        <p class="course-info">Section {{ qr_session.course.section }}</p>
        <form method="POST">
            <div class="form-group">
                <label for="matric_number">Matric Number *</label>
                <input type="text" id="matric_number" name="matric_number" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
    </div>
</div>
{% endblock %}
