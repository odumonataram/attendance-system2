{% extends "base.html" %}
{% block title %}Not Registered{% endblock %}
{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">❌</div>
        <h1>Not Registered</h1>
        <p>You are not registered for this course.</p>
        <p><strong>Course:</strong> {{ course.course_code }} - {{ course.course_name }}</p>
        <p>Please contact your lecturer or administrator.</p>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Done</a>
    </div>
</div>
{% endblock %}
